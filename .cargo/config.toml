# Enable fullfp16 for ARM64 targets to fix gemm-f16 inline assembly errors.
# This is required by candle-core's gemm dependency on ARM architectures.

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+fp16"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+fp16"]
