[workspace]
resolver = "2"
members = [
    "crates/buddhi-core",
    "crates/buddhi-config",
    "crates/buddhi-cli",
    "crates/buddhi-testsupport",
    "crates/buddhi-heuristics",
    "crates/buddhi-brain",
    "crates/buddhi-token",
    "crates/buddhi-llm",
    "crates/buddhi-tools",
    "crates/buddhi-security",
    "crates/buddhi-context",
    "crates/buddhi-verify",
    "crates/buddhi-rules",
    "crates/buddhi-memory",
    "crates/buddhi-engine",
    "crates/buddhi-inference",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rs-gigatoken = { git = "https://github.com/InfidelRahul/rs-gigatoken.git", branch = "main" }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
futures-util = "0.3"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-go = "0.21"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
memmap2 = "0.9"
tokenizers = "0.19"
rand = "0.8"
llama-cpp-2 = "0.1.93"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
