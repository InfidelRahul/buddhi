[workspace]
resolver = "2"
members = [
    "crates/buddhi-core",
    "crates/buddhi-config",
    "crates/buddhi-cli",
    "crates/buddhi-testsupport",
    "crates/buddhi-heuristics",
    "crates/buddhi-brain",
    "crates/buddhi-token",
    "crates/buddhi-llm",
    "crates/buddhi-tools",
    "crates/buddhi-security",
    "crates/buddhi-context",
    "crates/buddhi-graph",
    "crates/buddhi-verify",
    "crates/buddhi-rules",
    "crates/buddhi-memory",
    "crates/buddhi-engine",
    "crates/buddhi-inference",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
safetensors = "0.8"
petgraph = "0.8"
tree-sitter-language-pack = "1.15"
rs-gigatoken = "0.10.0"
anyhow = "1.0"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
async-trait = "0.1"
futures-util = "0.3"



memmap2 = "0.9"
tokenizers = "0.23"
rand = "0.8"
llama-cpp-2 = { version = "0.1.93", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
