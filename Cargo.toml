[workspace]
resolver = "2"
members = [
    "crates/dhi-core",
    "crates/dhi-config",
    "crates/dhi-cli",
    "crates/dhi-testsupport",
    "crates/dhi-heuristics",
    "crates/dhi-brain",
    "crates/dhi-token",
    "crates/dhi-llm",
    "crates/dhi-tools",
    "crates/dhi-security",
    "crates/dhi-context",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
futures-util = "0.3"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
